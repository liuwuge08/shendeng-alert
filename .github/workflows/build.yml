name: BuildAPK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d $HOME
          echo "$HOME/gradle-8.2/bin" >> $GITHUB_PATH
          rm gradle-8.2-bin.zip

      - name: Build with limited memory
        run: |
          export GRADLE_OPTS="-Xmx2g -Dorg.gradle.jvmargs=-Xmx2g"
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" > ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=false" >> ~/.gradle/gradle.properties
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log
          echo "BUILD_EXIT=$?"

      - name: If success - commit APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app-debug.apk
          git commit -m "APK build $(date +%Y%m%d-%H%M%S)"
          git push

      - name: If failure - report error
        if: failure()
        run: |
          # Extract error summary
          ERRORS=$(grep -i "error:\|FAILURE:\|BUILD FAILED\|Could not resolve\|Exception:" /tmp/build.log | head -20 | tr '
' ' | ')
          echo "Build errors: $ERRORS"
          
          # Write error report to a file and commit it
          echo "=== BUILD FAILED ===" > /tmp/error_report.txt
          echo "Date: $(date)" >> /tmp/error_report.txt
          echo "" >> /tmp/error_report.txt
          echo "=== Last 100 lines of build log ===" >> /tmp/error_report.txt
          tail -100 /tmp/build.log >> /tmp/error_report.txt
          
          cp /tmp/error_report.txt ./build_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build_error.txt
          git commit -m "build failed: $(echo $ERRORS | cut -c1-80)"
          git push
          exit 1
