name: BuildAPK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d $HOME
          echo "$HOME/gradle-8.2/bin" >> $GITHUB_PATH
          rm gradle-8.2-bin.zip

      - name: Build Debug APK
        id: build
        run: |
          export GRADLE_OPTS="-Xmx2g"
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m" > ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          
          gradle assembleDebug --no-daemon > /tmp/build.log 2>&1
          EXIT=$?
          
          echo "=== BUILD EXIT: $EXIT ==="
          if [ $EXIT -ne 0 ]; then
            echo "=== LAST 80 LINES ==="
            tail -80 /tmp/build.log
            echo "=== ERROR LINES ==="
            grep -i "error:\|FAILURE\|Could not" /tmp/build.log | head -20
          else
            ls -la app/build/outputs/apk/debug/
          fi
          
          # Upload log to transfer.sh
          LOG_URL=$(curl -s --upload-file /tmp/build.log https://transfer.sh/build.log)
          echo "LOG_URL=$LOG_URL"
          echo "log_url=$LOG_URL" >> $GITHUB_OUTPUT
          
          # Upload APK if success
          if [ $EXIT -eq 0 ]; then
            APK_URL=$(curl -s --upload-file app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/app-debug.apk)
            echo "APK_URL=$APK_URL"
            echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT
          fi
          
          exit $EXIT
